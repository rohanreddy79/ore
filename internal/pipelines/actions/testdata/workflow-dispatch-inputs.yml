name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        default: staging
        options: [staging, production]
      dry-run:
        type: boolean
        default: true
      version:
        type: string
        description: Version to deploy
      replicas:
        type: number
        default: 2
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - run: |
          echo "env=${{ inputs.environment }} dry=${{ inputs.dry-run }} version=${{ inputs.version }} replicas=${{ inputs.replicas }}"
      - if: ${{ !inputs.dry-run }}
        run: ./deploy.sh ${{ inputs.version }}
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}
