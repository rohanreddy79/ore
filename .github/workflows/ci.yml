# The merge gate on GitHub-hosted runners: scripts/e2e.sh (web app build, unit
# tests and size budget, gofmt, vet, go test, build, the Playwright suite
# against a real `ore serve`, and `ore demo` on Docker) in one job, and
# scripts/test-postgres.sh (the Go suite on Postgres in a container) in a
# second job that runs in parallel.
#
# Every action is pinned to a full commit SHA (the version is in the comment);
# bump the SHA and the comment together.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  gate:
    name: merge gate (scripts/e2e.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go from go.mod (caches the module and build caches on go.sum)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node 22 (caches ~/.npm on ui/package-lock.json)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Playwright version (from ui/package-lock.json)
        id: playwright
        run: echo "version=$(node -p "require('./ui/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # scripts/e2e.sh runs `npm ci` itself, so the browser is installed with
      # the playwright CLI at the locked version instead of a second install.
      # The browser build comes from the cache when it can; the system packages
      # it needs are installed every run (a no-op for packages already present).
      - name: Install Playwright Chromium and its system packages
        env:
          PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx --yes "playwright@$PLAYWRIGHT_VERSION" install-deps chromium
          else
            npx --yes "playwright@$PLAYWRIGHT_VERSION" install --with-deps chromium
          fi

      - name: Merge gate
        env:
          ORE_UI_E2E: "1"
        run: scripts/e2e.sh

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
          retention-days: 7

  postgres:
    name: Go suite on Postgres (scripts/test-postgres.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go from go.mod (caches the module and build caches on go.sum)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test on Postgres
        run: scripts/test-postgres.sh
