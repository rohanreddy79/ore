id: git-and-forge/a-green-pipeline
version: 0.1.0
track: 1-git-and-forge
title_key: title
estimated_minutes: 25
prerequisites: [git-and-forge/your-first-change]
artifact: a green pipeline on a real change
exam_objectives:
  - github-actions: "Workflow triggers; Reading workflow results"
  - gitlab-git-associate: "CI/CD basics"
mode: scratch_repository
languages: [en]
quota_class: learning
template:
  files:
    - path: README.md
      content: |
        # A green pipeline

        `.ore/pipeline.yaml` checks that `learn/pipeline.md` exists and says "green".
        It is red until you make it so.
    - path: .ore/pipeline.yaml
      content: |
        version: 0
        tasks:
          - id: check
            image: alpine:3
            run: test -f learn/pipeline.md && grep -q green learn/pipeline.md
steps:
  - id: 1-make-the-check-pass
    assert:
      query: ref.exists('learn/pipeline-*') && file.contains('learn/pipeline-*', 'learn/pipeline.md', 'green')
    hint_after_failures: 2
  - id: 2-run-the-pipeline
    assert:
      query: pipeline.green('learn/pipeline-*')
    hint_after_failures: 1
  - id: 3-open-a-change
    assert:
      query: change.open('learn/pipeline-*') || change.merged('learn/pipeline-*')
    hint_after_failures: 1
  - id: 4-merge-it
    assert:
      query: change.merged('learn/pipeline-*')
    hint_after_failures: 1
on_complete:
  credential: track-1-progress
