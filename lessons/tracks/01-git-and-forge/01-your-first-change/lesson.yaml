# Lesson manifest v0 — see docs/changes/learn.md for the format and the assert language.
# A lesson is a template plus a lesson pipeline (one assert per step) that runs on the
# learner's own repository. Four steps or fewer, one real artifact.
id: git-and-forge/your-first-change
version: 0.2.0
track: 1-git-and-forge
title_key: title                 # localized in steps/<lang>.md front matter
estimated_minutes: 30
prerequisites: []
artifact: a merged change in your own repository
exam_objectives:                 # external currency for the credential
  - github-foundations: "Introduction to Git; Working with GitHub repositories; Collaboration features"
  - gitlab-git-associate: "Basic Git workflow"
mode: scratch_repository         # the classic first lesson: Ore creates learn-your-first-change-<you>
languages: [en, hi, pt-BR]       # shipped: steps/<lang>.md exists and is reviewed
quota_class: learning            # never competes with production CI
template:
  files:
    - path: README.md
      content: |
        # Your first change

        This repository was created by Ore for the lesson *Your first change*.
        Follow the steps in the lesson; every step is checked against this repository.
steps:
  - id: 1-clone-and-branch
    assert:
      query: ref.exists('learn/first-change-*')
    hint_after_failures: 2
  - id: 2-commit-and-push
    assert:
      query: ref.commits_by(learner, 'learn/first-change-*') >= 1 && file.exists('learn/first-change-*', 'learn/hello.md')
    hint_after_failures: 2
  - id: 3-open-a-change
    assert:
      query: change.open('learn/first-change-*') || change.merged('learn/first-change-*')
    hint_after_failures: 1
  - id: 4-merge-it
    assert:
      query: change.merged('learn/first-change-*') && file.exists(default, 'learn/hello.md')
    hint_after_failures: 1
on_complete:
  credential: track-1-progress          # Open Badges 3.0 evidence: the merged change id (deferred)
  cleanup: delete ref learn/first-change-*, remove learn/ directory via a follow-up change (deferred)
